<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="css/styles.css">
        <title>Image Assignment</title>
    </head>
    <body>
        <header>
            <h1>Image Assignment</h1>
        </header>
        <div class="image-submit-box">
            <div class="image-display">
                <div class="random-image">
                    <img id="randomImage" src="img/Dune Part 2 paul walk.jpg" alt="Random Image">
                </div>
            </div>
            <div class="email-submit">
                <h2>Assign Image to an Email</h2>
                <div class="email-input-box">
                    <label for="emailInput">Email address</label>
                    <input type="email" placeholder="Enter Email..." id="emailInput">
                </div>
                <button id="submitButton" type="button">Add Image</button>
            </div>
        </div>
        <div class="collection">
            <h2>Your collections</h2>
            <div class="email-one-collection">
                <h3>Email address</h3>
                <div class="collection-images">
                    <img src="img/Dune Part 2 paul walk.jpg" alt="Random Image">
                    <img src="img/Dune Part 2 paul walk.jpg" alt="Random Image">
                </div>
            </div>
        </div>
    </body>
